<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paywall Radar — Bluesky Paywall Labeler</title>
    <meta
      name="description"
      content="A Bluesky labeler that warns you when posts link to paywalled content."
    />
  </head>
  <body class="bg-white text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100">
    <div class="mx-auto max-w-2xl px-6 py-16">
      <h1 class="text-4xl font-bold tracking-tight">Paywall Radar</h1>
      <p class="mt-4 text-lg text-neutral-600 dark:text-neutral-300">
        A Bluesky labeler that warns you when posts link to paywalled content. Subscribe to see
        paywall indicators on posts in your feed.
      </p>

      <div class="mt-8 flex flex-wrap gap-4">
        <a
          href="https://bsky.app/profile/paywall-radar.bsky.social"
          target="_blank"
          rel="noopener noreferrer"
          class="rounded-lg bg-blue-600 px-6 py-3 font-medium text-white hover:bg-blue-700"
        >
          Subscribe on Bluesky
        </a>
        <a
          href="/dashboard"
          class="rounded-lg border border-neutral-300 px-6 py-3 font-medium text-neutral-700 hover:bg-neutral-50 dark:border-neutral-600 dark:text-neutral-200 dark:hover:bg-neutral-800"
        >
          View Dashboard
        </a>
      </div>

      <div id="live-stats" class="mt-12"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
