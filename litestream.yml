exec: /usr/local/bin/node /app/dist/server/index.js

# L0 retention checks issue 2 LIST (Class A) ops per run; the 15s default
# costs ~345K R2 Class A ops/month. 1m is plenty at a 60s sync interval.
l0-retention: 10m
l0-retention-check-interval: 1m

dbs:
  - path: ${DB_PATH}
    restore-if-db-not-exists: true
    busy-timeout: 5s
    replica:
      url: ${LITESTREAM_REPLICA_URL}
      sync-interval: 60s
